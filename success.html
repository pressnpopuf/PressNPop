<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PressN'Pop – Tack för din beställning ♡</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff7fa;
            font-family: Arial, sans-serif;
            color: #555;
        }

        .box {
            width: min(90%, 500px);
            padding: 45px 30px;
            text-align: center;
            background: white;
            border: 1px solid #efdce2;
            border-radius: 25px;
            box-sizing: border-box;
        }

        .check {
            font-size: 65px;
            color: #d98ca5;
        }

        h1 {
            color: #b85f7d;
            margin: 15px 0;
        }

        p {
            line-height: 1.7;
            color: #777;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            border-radius: 25px;
            background: #d98ca5;
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="check">✓</div>

    <h1>Tack för din beställning! ♡</h1>

    <p>
        Din betalning är genomförd och din beställning
        har skickats till PressN'Pop.
    </p>

    <p>
        Vi återkommer till dig så snart som möjligt.
    </p>

    <a href="/PressNPop/">
        Tillbaka till PressN'Pop
    </a>

</div>

</body>
</html>
